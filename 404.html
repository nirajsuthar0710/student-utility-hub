<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="robots"
        content="noindex">

    <title>Page Not Found | Student Utility Hub</title>

    <link rel="icon"
        href="favicon.svg"
        type="image/svg+xml">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;
            color: #17233a;

            text-align: center;
        }

        .error-box {
            max-width: 600px;
            width: 100%;

            padding: 45px 25px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 70px;
            margin: 0;

            color: #2563eb;
        }

        h2 {
            margin: 10px 0;

            font-size: 28px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;

            padding: 12px 22px;

            border-radius: 10px;

            background: #2563eb;
            color: white;

            text-decoration: none;

            font-weight: bold;

            transition: 0.2s;
        }

        .home-button:hover {
            transform: translateY(-2px);
            background: #1d4ed8;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 55px;
            }

            h2 {
                font-size: 23px;
            }

            .error-box {
                padding: 35px 20px;
            }

        }

    </style>

</head>


<body>

    <main class="error-box">

        <div class="icon">
            🎓
        </div>

        <h1>
            404
        </h1>

        <h2>
            Page Not Found
        </h2>

        <p>
            Oops! The page you're looking for
            doesn't exist or may have been moved.
        </p>

        <a
            class="home-button"
            href="index.html">

            ← Back to Student Utility Hub

        </a>

    </main>

</body>

</html>
